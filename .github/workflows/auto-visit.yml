name: Google Ranking Automation

on:
  schedule:
    # 台灣時間 (UTC+8) 每天 8 個時間點：00:30 03:30 06:30 08:30 11:30 14:30 16:30 20:30
    - cron: '30 0,3,6,8,12,16,19,22 * * *'
  workflow_dispatch:
    inputs:
      submit_indexing:
        description: 'Also submit indexing notifications (requires verified keys)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: google-ranking
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run audit
      # Search Console refreshes once a day; the extra runs just re-render the same numbers.
      - run: npm run gsc
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit
          path: reports/
          retention-days: 30

  indexing:
    if: github.event_name == 'workflow_dispatch' && inputs.submit_indexing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run indexing module
        run: node index.js --indexing-only
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

  indexnow:
    if: github.event_name == 'workflow_dispatch' && inputs.submit_indexing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run IndexNow module
        run: node index.js --indexnow-only
        env:
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
