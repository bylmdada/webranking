name: Google Ranking Automation

on:
  schedule:
    - cron: '30 */8 * * *' # Every 8 hours at :30
  workflow_dispatch:
    inputs:
      submit_indexing:
        description: 'Also submit indexing notifications (requires verified keys)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: google-ranking
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit
          path: reports/
          retention-days: 30

  indexing:
    if: github.event_name == 'workflow_dispatch' && inputs.submit_indexing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run indexing module
        run: node index.js --indexing-only
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

  indexnow:
    if: github.event_name == 'workflow_dispatch' && inputs.submit_indexing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run IndexNow module
        run: node index.js --indexnow-only
        env:
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
