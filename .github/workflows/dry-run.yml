name: Google Ranking Dry Run

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: google-ranking-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - run: npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run full dry-run flow
        run: npm run dry-run
        env:
          RUN_MODULES: audit,visit,search,indexing,indexnow

      - name: Run env-driven dry-run check
        run: node index.js
        env:
          DRY_RUN: 'true'